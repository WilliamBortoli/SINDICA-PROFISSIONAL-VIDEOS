<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0d1118; }
  * { box-sizing: border-box; }
  #cam { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 760px; overflow: hidden; background: #9fd3f7; }
  .p3 { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 0 0; }
  .f { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .lbl { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap;
         font: 800 30px "Inter Display", Inter, sans-serif; letter-spacing: 2px; color: #e7b866;
         background: #0d1118; border: 3px solid #e7b866; border-radius: 40px; padding: 6px 22px; }
  .roofTag { display: none; position: absolute; font: 900 22px "Inter Display", Inter, sans-serif; color: #e7b866;
             background: #0d1118; border: 2px solid #e7b866; border-radius: 14px; padding: 1px 8px; letter-spacing: 1px;
             transform: translate(-50%, -50%); white-space: nowrap; }
  svg text { font-family: "Inter Display", Inter, sans-serif; }
  #front, #overlay { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="cam"><div id="world" class="p3"></div></div>
<svg id="front" width="1080" height="1920" viewBox="0 0 1080 1920" style="opacity:0"></svg>
<svg id="overlay" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>

<script>
const GOLD = "#e7b866";
const NS = "http://www.w3.org/2000/svg";
const lerp = (a, b, x) => a + (b - a) * x;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function div(parent, cls, style) {
  const d = document.createElement("div"); d.className = cls || "";
  Object.assign(d.style, style || {}); parent.appendChild(d); return d;
}
function sv(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

/* =====================================================================
   CENA 1 — MAQUETE 3D (coordenadas da foto aérea, 932 x 1760)
   ===================================================================== */
const world = document.getElementById("world");

// ---------- chão (SVG plano) ----------
const ground = sv("svg", { width: 2600, height: 3400, viewBox: "-800 -900 2600 3400" });
Object.assign(ground.style, { position: "absolute", left: "-800px", top: "-900px" });
world.appendChild(ground);
sv("rect", { x: -800, y: -900, width: 2600, height: 3400, fill: "#6b9a4f" }, ground);
// mata em volta
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 420; i++) {
  const x = -800 + rnd() * 2600, y = -900 + rnd() * 3400;
  if (x > 40 && x < 830 && y > 10 && y < 1680) continue;
  sv("circle", { cx: x, cy: y, r: 18 + rnd() * 30, fill: rnd() > 0.5 ? "#4c7636" : "#557f3d" }, ground);
}
sv("rect", { x: 830, y: 380, width: 220, height: 640, fill: "#b39b6e" }, ground); // terreno ao lado
// rua pública (embaixo)
sv("rect", { x: -800, y: 1655, width: 2600, height: 110, fill: "#5d636c" }, ground);
for (let x = -780; x < 1800; x += 70) sv("rect", { x, y: 1706, width: 36, height: 5, fill: "#5d636e" }, ground);
sv("rect", { x: -800, y: 1648, width: 2600, height: 8, fill: "#3a3f48" }, ground);
// terreno do condomínio
const fencePts = [[70,40],[800,40],[800,1620],[510,1620],[510,1520],[330,1520],[330,1650],[70,1650]];
sv("polygon", { points: fencePts.map(p => p.join(",")).join(" "), fill: "#7cb35c" }, ground);
// corredor de acesso (fora da portaria): motos + carros
sv("rect", { x: 330, y: 1520, width: 180, height: 135, fill: "#8a8f97" }, ground);
for (let x = 428; x < 506; x += 13) sv("rect", { x, y: 1526, width: 1.5, height: 24, fill: "#fff", opacity: 0.35 }, ground);
for (let y = 1562; y < 1640; y += 18) sv("rect", { x: 440, y, width: 66, height: 1.5, fill: "#fff", opacity: 0.3 }, ground);
// rua central + estacionamentos + calçadão
sv("rect", { x: 330, y: 70, width: 90, height: 1590, fill: "#60666f" }, ground);
for (let y = 110; y < 1500; y += 46) sv("rect", { x: 387, y, width: 4, height: 22, fill: GOLD, opacity: 0.75 }, ground);
sv("rect", { x: 296, y: 70, width: 30, height: 1450, fill: "#c9c5bb" }, ground);             // calçada (lado esquerdo)
for (let y = 72; y < 1520; y += 9) sv("rect", { x: 296, y, width: 30, height: 0.8, fill: "#000", opacity: 0.25 }, ground);
sv("rect", { x: 309, y: 70, width: 8, height: 1450, fill: "#e0b43c" }, ground);             // piso tátil
for (let y = 72; y < 1520; y += 4) sv("rect", { x: 310, y, width: 6, height: 1.2, fill: "#a8841f" }, ground);
sv("rect", { x: 420, y: 140, width: 35, height: 1375, fill: "#6e747d" }, ground);
sv("rect", { x: 326, y: 140, width: 32, height: 1375, fill: "#6e747d" }, ground);           // vagas lado esquerdo
for (let y = 100; y < 1515; y += 14) {
  if (y > 140) sv("rect", { x: 420, y, width: 35, height: 1.2, fill: "#fff", opacity: 0.22 }, ground);
  if (y > 140) sv("rect", { x: 326, y, width: 32, height: 1.2, fill: "#fff", opacity: 0.22 }, ground);
}
sv("rect", { x: 455, y: 140, width: 3, height: 1375, fill: "#4a4f58" }, ground);
// poças de luz (postes e arandelas)
const gdefs = sv("defs", {}, ground);
gdefs.innerHTML = '<radialGradient id="pool"><stop offset="0" stop-color="#ffd98a" stop-opacity="0"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>';
for (let y = 180; y < 1480; y += 120) sv("ellipse", { cx: 313, cy: y, rx: 34, ry: 34, fill: "url(#pool)" }, ground);
sv("rect", { x: 300, y: 60, width: 190, height: 80, fill: "#8a8f97" }, ground); // fim da rua
for (let x = 306; x < 486; x += 16) sv("rect", { x, y: 66, width: 1.5, height: 30, fill: "#fff", opacity: 0.3 }, ground);
// caminhos até os blocos
for (const y of [255, 545, 855, 1160]) sv("rect", { x: 490, y, width: 70, height: 5, fill: "#5b606a" }, ground);
// quadra de areia, playground, salão (pisos)
sv("rect", { x: 565, y: 1345, width: 175, height: 85, fill: "#9a8458" }, ground);
sv("rect", { x: 575, y: 1352, width: 155, height: 71, fill: "none", stroke: "#f3e3c3", "stroke-width": 1.5, opacity: 0.6 }, ground);
sv("line", { x1: 652, y1: 1352, x2: 652, y2: 1423, stroke: "#f3e3c3", "stroke-width": 1.5, opacity: 0.6 }, ground);
sv("rect", { x: 652, y: 1475, width: 88, height: 125, fill: "#7c6847" }, ground);
sv("rect", { x: 540, y: 1462, width: 100, height: 126, fill: "#4a4f58" }, ground);
// sombras suaves dos prédios
const ROWS_L = [[100, 290], [300, 590], [600, 895], [905, 1200], [1210, 1500]];
const ROWS_R = [[290, 590], [600, 895], [905, 1200]];
for (const [a, b] of ROWS_L) sv("rect", { x: 126, y: a + 8, width: 180, height: b - a, fill: "#000", opacity: 0.35 }, ground);
for (const [a, b] of ROWS_R) sv("rect", { x: 561, y: a + 8, width: 185, height: b - a, fill: "#000", opacity: 0.35 }, ground);
sv("ellipse", { cx: 175, cy: 1600, rx: 16, ry: 60, fill: "#000", opacity: 0.4, transform: "rotate(-25 175 1600)" }, ground); // sombra da torre

// ---------- caixas 3D ----------
function face(g, style) { return div(g, "f", style); }
function box(x, y, z, w, d, h, c) {
  const g = div(world, "p3", { width: w + "px", height: d + "px", transform: `translate3d(${x}px,${y}px,${z}px)` });
  face(g, { width: w + "px", height: h + "px", transform: "rotateX(90deg)", background: c.n || c.s }); // norte
  face(g, { width: h + "px", height: d + "px", transform: "rotateY(-90deg)", background: c.w || c.e }); // oeste
  face(g, { width: h + "px", height: d + "px", transform: `translateX(${w}px) rotateY(-90deg)`, background: c.e }); // leste
  face(g, { width: w + "px", height: h + "px", transform: `translateY(${d}px) rotateX(90deg)`, background: c.s }); // sul
  const top = face(g, { width: w + "px", height: d + "px", transform: `translateZ(${h}px)`, background: c.top });
  g.top = top;
  return g;
}
function cyl(cx, cy, z, r, h, side, top, n = 12) {
  const g = div(world, "p3", { transform: `translate3d(${cx}px,${cy}px,${z}px)` });
  const fw = 2 * r * Math.sin(Math.PI / n) + 0.6, ap = r * Math.cos(Math.PI / n);
  for (let i = 0; i < n; i++) {
    const shade = 0.75 + 0.25 * Math.cos((i / n) * 2 * Math.PI - 1.2);
    face(g, { width: fw + "px", height: h + "px", left: -fw / 2 + "px", transformOrigin: `${fw / 2}px 0`,
      transform: `rotateZ(${(i / n) * 360}deg) translateY(${ap}px) rotateX(90deg)`, background: side, filter: `brightness(${shade})` });
  }
  face(g, { width: 2 * r + "px", height: 2 * r + "px", left: -r + "px", top: -r + "px", borderRadius: "50%",
    transform: `translateZ(${h}px)`, background: top });
  return g;
}
// paredes com janelas
const WIN = "#8fb6d9", WALL = "#efe5cf", BAND = "#b4b7bc", BANDH = 10;
const wallNS = `linear-gradient(180deg, ${BAND} 0 ${BANDH}px, transparent ${BANDH}px), repeating-linear-gradient(0deg, ${WALL} 0 5px, transparent 5px 14px), repeating-linear-gradient(90deg, ${WALL} 0 6px, ${WIN} 6px 11px, ${WALL} 11px 16px)`;
const wallEW = `linear-gradient(90deg, ${BAND} 0 ${BANDH}px, transparent ${BANDH}px), repeating-linear-gradient(90deg, ${WALL} 0 5px, transparent 5px 14px), repeating-linear-gradient(0deg, ${WALL} 0 6px, ${WIN} 6px 11px, ${WALL} 11px 16px)`;
const wallEWd = `linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)), ${wallEW}`;
const endWall = `linear-gradient(180deg, ${BAND} 0 ${BANDH}px, ${WALL} ${BANDH}px)`;          // pontas das alas: sem janelas
const endWallD = `linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)), ${endWall}`;
const roof = "linear-gradient(90deg, #c3c8cf 0 48%, #9097a2 52% 100%)";
const H = 72; // 5 andares
function wing(x, y, d) { box(x, y, 0, 64, d, H, { top: roof, n: endWallD, s: endWall, w: wallEW, e: wallEWd }); }
function hRow(x0, a, b) {
  wing(x0, a, b - a); wing(x0 + 111, a, b - a);
}
function building(x, y, w, d) {
  box(x, y, 0, w, d, H, { top: "linear-gradient(90deg, #a3a9b3 0 49%, #c2c7cf 49.5% 50.5%, #737a86 51% 100%)", n: wallNS, s: wallNS, w: wallEW, e: wallEWd });
}
function link(x, y) { box(x, y, 0, 36, 26, H - 8, { top: "#7c828d", n: "#4e5563", s: "#5a6272", w: "#4e5563", e: "#444b58" }); }
function rowTag(x, y, label) {
  const t = div(world, "roofTag", {}); t.textContent = label;
  t.style.left = x + "px"; t.style.top = y + "px"; t.style.transform += ` translateZ(${H + 2}px)`;
  t.style.transform = `translate3d(0,0,${H + 2}px) translate(-50%,-50%)`;
}
// cada prédio = 2 blocos (metade de baixo e metade de cima). Esquerda sobe A→I; direita sobe J (perto da quadra) → O
const TAGS_L = [["I"], ["G", "H"], ["E", "F"], ["C", "D"], ["A", "B"]]; // [metade de baixo, metade de cima]
const TAGS_R = [["N", "O"], ["L", "M"], ["J", "K"]];
ROWS_L.forEach(([a, b], i) => {
  hRow(120, a, b);
  const tl = TAGS_L[i];
  if (tl.length === 1) rowTag(215, a + (b - a) * 0.5, tl[0]);
  else { rowTag(215, a + (b - a) * 0.75, tl[0]); rowTag(215, a + (b - a) * 0.25, tl[1]); }
});
ROWS_R.forEach(([a, b], i) => {
  hRow(556, a, b);
  rowTag(651, a + (b - a) * 0.75, TAGS_R[i][0]); rowTag(651, a + (b - a) * 0.25, TAGS_R[i][1]);
});
// salão de festas
box(548, 1470, 0, 84, 108, 24, { top: "linear-gradient(90deg,#8a5a3c 0 50%,#6e4630 50%)", n: "#7d6a58", s: "#9b8670", w: "#857160", e: "#6a5848" });
// quadra de areia: tela nas laterais + teto com LED
const MESH = "repeating-linear-gradient(90deg, rgba(210,215,225,.55) 0 1px, transparent 1px 6px), repeating-linear-gradient(0deg, rgba(210,215,225,.45) 0 1px, transparent 1px 6px)";
const quadra = box(565, 1345, 0, 175, 85, 34, { top: `radial-gradient(circle, #ffe7a8 0 1.6px, rgba(255,231,168,.25) 2.4px, transparent 3.5px) 0 0/16px 16px, ${MESH}`, n: MESH, s: MESH, w: MESH, e: MESH });
// playground
box(662, 1490, 0, 4, 4, 22, { top: "#c0392b", s: "#c0392b", e: "#962d22" });
box(700, 1490, 0, 4, 4, 22, { top: "#c0392b", s: "#c0392b", e: "#962d22" });
box(662, 1490, 22, 42, 4, 3, { top: "#e74c3c", s: "#c0392b", e: "#962d22" });           // balanço
box(668, 1540, 0, 34, 30, 16, { top: "#2e86de", s: "#1f6fb8", e: "#1a5a95", n: "#1f6fb8" }); // 5 em 1
box(676, 1546, 16, 18, 18, 10, { top: "#f1c40f", s: "#d4ac0d", e: "#b7950b" });
box(708, 1548, 0, 22, 8, 8, { top: "#f39c12", s: "#d68910", e: "#b9770e" });           // escorrega
box(712, 1585, 0, 26, 4, 5, { top: "#27ae60", s: "#1e8449", e: "#196f3d" });           // gangorra
// caixas d'água: 6 de 10 mil L + torre de 75 mil L
[[160, 1545], [190, 1545], [160, 1575], [190, 1575], [160, 1605], [190, 1605]].forEach(([x, y]) =>
  cyl(x, y, 0, 11, 20, "#3e74b3", "radial-gradient(#6a9ad0,#3e74b3)"));
cyl(120, 1600, 0, 6, 95, "#9aa0aa", "#b5bbc4", 10);
cyl(120, 1600, 95, 17, 30, "#b8bec7", "radial-gradient(#d6dbe2,#9aa0aa)", 14);
// portaria: portão de veículos | portão de pedestres com facial | guarita
box(450, 1470, 0, 56, 46, 26, { top: "#6c7686", n: "#56606f", s: `linear-gradient(0deg, ${GOLD} 0 4px, #6b7689 4px)`, w: "#5d6777", e: "#4b5463" });
box(445, 1462, 26, 66, 58, 3, { top: "#3c4454", s: "#2f3644", e: "#2f3644", n: "#2f3644" });
box(421, 1518, 0, 22, 2, 18, { top: "#8a93a3", s: MESH, n: MESH }); // portão pedestre
const faceReader = box(444, 1521, 0, 3, 3, 16, { top: "#222", s: "#1c2230", e: "#1c2230" });
const faceLight = cyl(445.5, 1523, 16, 3, 2, GOLD, GOLD, 8);
const tagPole = box(322, 1526, 0, 4, 4, 18, { top: "#222", s: "#2a3140", e: "#1e2430" });
const tagLight = cyl(324, 1528, 18, 4, 2, GOLD, GOLD, 8);
// portão de veículos deslizante
const GATE = "repeating-linear-gradient(90deg, #a6aebb 0 2px, transparent 2px 7px), linear-gradient(transparent 0 2px, transparent 2px)";
const gate = div(world, "p3", {});
face(gate, { width: "90px", height: "18px", transform: "rotateX(90deg)", background: GATE, borderTop: "2px solid #a6aebb", borderBottom: "2px solid #a6aebb" });
// cerca (grade) em volta
function fence(x1, y1, x2, y2) {
  const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  div(world, "f", { width: len + "px", height: "14px", transform: `translate3d(${x1}px,${y1}px,0) rotateZ(${ang}deg) rotateX(90deg)`,
    background: "repeating-linear-gradient(90deg, rgba(190,198,210,.7) 0 1px, transparent 1px 5px)", borderBottom: "2px solid #9aa3b1" });
}
fence(70, 40, 800, 40); fence(800, 40, 800, 1620); fence(800, 1620, 510, 1620); fence(510, 1620, 510, 1520);
fence(70, 40, 70, 1650); fence(70, 1650, 330, 1650); fence(330, 1650, 330, 1520);
// núcleo de cada bloco (barra do H): entrada pela lateral, dentro do fosso — porta com facial no térreo + janela em cada lance de escada
function sconce(x, y, z) {
  div(world, "f", { width: "12px", height: "12px", borderRadius: "50%", background: "radial-gradient(#fffbe9 0 22%, rgba(255,214,140,.65) 35%, rgba(255,214,140,0) 70%)",
    transform: `translate3d(${x - 6}px,${y}px,${z - 6}px) rotateX(90deg)` });
}
function panelY(x, y, z, wx, hz, bg) {
  div(world, "f", { width: wx + "px", height: hz + "px", background: bg, transform: `translate3d(${x}px,${y}px,${z}px) rotateX(90deg)` });
}
const FLOOR = H / 5;
for (const [x0, rows] of [[120, ROWS_L], [556, ROWS_R]])
  for (const [a, b] of rows) {
    const ys = b - a < 220 ? [a + (b - a) / 2] : [a + (b - a) * 0.25, a + (b - a) * 0.75];
    for (const yc of ys) {
      const xc = x0 + 87.5;
      box(x0 + 64, yc - 14, 0, 47, 28, H - 2, { top: "linear-gradient(90deg,#8a909b,#767c87)", n: endWallD, s: endWall, w: endWall, e: endWallD });
      for (const [fy, o] of [[yc - 14, -1], [yc + 14, 1]]) {
        panelY(xc - 6, fy + o * 0.6, 0, 12, 13, "linear-gradient(90deg, #ffe3a3 0 1.2px, #3a2e1f 1.2px calc(100% - 1.2px), #ffe3a3 0)"); // porta
        panelY(xc + 8, fy + o * 0.7, 6, 2.6, 3.6, GOLD);                                                                          // leitor facial
        for (let f = 0; f < 5; f++) panelY(xc - 3.5, fy + o * 0.6, FLOOR * (f + 1) - 4, 7, 8, "#ffe3a3");                        // janela do lance
        sconce(xc - 10, fy + o * 1, 15);
        sv("ellipse", { cx: xc, cy: fy + o * 12, rx: 16, ry: 14, fill: "url(#pool)" }, ground);
      }
    }
  }
// lixeira coletiva (à direita das caixas d'água)
box(236, 1598, 0, 70, 40, 16, { top: "#3d4a40", n: "#55665a", s: "repeating-linear-gradient(90deg,#55665a 0 3px,transparent 3px 7px)", w: "#4a594e", e: "#3f4d43" });
box(232, 1594, 16, 78, 48, 2.5, { top: "#2f3a33", s: "#26302a", e: "#26302a", n: "#26302a" });
[["#2e7d32", 242], ["#6b6b6b", 262], ["#1565c0", 282]].forEach(([c, x]) => box(x, 1608, 0, 16, 20, 12, { top: c, s: c, e: "#222", n: c }));
// carros estacionados
const CARC = ["#c9ccd3", "#8e1f2b", "#2c3e50", "#e8e8e8", "#7f8c8d", "#1c1c1c", "#b0b7c2", "#5d4037"];
for (let y = 104; y < 1505; y += 14) {
  if (y > 145 && rnd() < 0.55) box(425, y + 1.5, 0, 24, 11, 7, { top: CARC[(y / 14 | 0) % 8], s: "#222", e: "#1a1a1a", n: "#222" });
  if (y > 145 && rnd() < 0.5) box(330, y + 1.5, 0, 24, 11, 7, { top: CARC[(y / 7 | 0) % 8], s: "#222", e: "#1a1a1a", n: "#222" });
}
for (let x = 430; x < 500; x += 13) if (rnd() < 0.7) box(x + 3, 1528, 0, 5, 18, 7, { top: "#1d1d1d", s: "#333", e: "#111" }); // motos
for (let y = 1566; y < 1640; y += 18) if (rnd() < 0.6) box(450, y + 3, 0, 24, 11, 7, { top: CARC[(y / 9 | 0) % 8], s: "#222", e: "#1a1a1a" });
// postes de luz na calçada
for (let y = 180; y < 1480; y += 120) {
  box(299, y, 0, 3, 3, 34, { top: "#333", s: "#444", e: "#333" });
  div(world, "f", { width: "22px", height: "22px", borderRadius: "50%", background: "radial-gradient(#fff4cf, rgba(255,214,140,0) 70%)", transform: `translate3d(${290}px,${y - 9}px,35px)` });
}
// árvores
function tree(x, y, r) {
  box(x - 1.5, y - 1.5, 0, 3, 3, 14, { top: "#3b2a1a", s: "#4a3422", e: "#3b2a1a" });
  div(world, "f", { width: 2 * r + "px", height: 2 * r + "px", borderRadius: "50%", transform: `translate3d(${x - r}px,${y - r}px,14px)`,
    background: "radial-gradient(circle at 35% 35%, #4f8a5c, #2c5a3a 70%)" });
}
for (let y = 120; y < 1500; y += 95) { tree(92, y, 10); }
for (let y = 300; y < 1200; y += 110) { tree(778, y, 11); }
[[600, 160, 14], [700, 200, 16], [760, 1280, 18], [540, 1270, 12], [600, 1610, 10], [760, 1460, 14], [250, 1580, 12]].forEach(a => tree(...a));
// carro que entra pela TAG

function frontBlock(x, w, base, floors, tone) {
  const fh = 64, h = floors * fh, top = base - h, ww = w * 0.38, gx = x + ww, gw = w - 2 * ww;
  // núcleo recuado (barra do H) dentro do fosso: porta com facial + janela por lance
  sv("rect", { x: gx, y: top + 10, width: gw, height: h - 10, fill: "#151b2b" }, FS);
  const cx = gx + gw / 2;
  sv("rect", { x: cx - 30, y: top + 30, width: 60, height: h - 30, fill: tone.core }, FS);
  sv("rect", { x: cx - 30, y: base - 44, width: 60, height: 44, fill: tone.band, opacity: 0.8 }, FS);
  for (let f = 0; f < floors; f++) sv("rect", { x: cx - 11, y: top + 40 + f * fh, width: 22, height: 30, rx: 2, fill: "#ffe3a3", opacity: 0.85 }, FS);
  sv("rect", { x: cx - 16, y: base - 52, width: 32, height: 52, fill: "#3a2e1f", stroke: "#ffe3a3", "stroke-width": 2 }, FS);
  sv("rect", { x: cx + 20, y: base - 40, width: 7, height: 10, rx: 2, fill: GOLD }, FS);
  sv("ellipse", { cx, cy: base - 64, rx: 34, ry: 26, fill: "url(#glow)" }, FS);
  sv("rect", { x: cx - 4, y: base - 70, width: 8, height: 10, rx: 3, fill: "#fff3c4" }, FS);
  // as duas alas com telhado de duas águas
  for (const wx0 of [x, x + w - ww]) {
    sv("polygon", { points: `${wx0 - 6},${top} ${wx0 + ww + 6},${top} ${wx0 + ww / 2},${top - 46}`, fill: tone.roof }, FS);

    sv("rect", { x: wx0, y: base - 44, width: ww, height: 44, fill: tone.band }, FS);    // faixa cinza ~2 m
  }
}

const DURATION = 13;
window.DURATION = DURATION;
window.render = function (t) {
  // ---- câmera de drone ----
  const k = ease(prog(t, 1.2, 5.4));
  const tilt = lerp(0, 58, k), s = lerp(1.08, 2.45, k), rz = lerp(0, -10, k);
  const k1 = ease(prog(t, 1.2, 3.6)), k2 = ease(prog(t, 3.6, 5.4));
  const cx = lerp(lerp(440, 255, k1), 478, k2), cy = lerp(880, 1500, k1), oy = lerp(960, 1230, k);
  document.getElementById("cam").style.perspective = lerp(4200, 1500, k) + "px";
  world.style.transform = `translate(540px, ${oy}px) rotateX(${tilt}deg) rotateZ(${rz}deg) scale3d(${s},${s},${s}) translate(${-cx}px, ${-cy}px)`;
  for (const d of Object.values(L)) {
    const [x, y, z] = d.pos;
    d.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateZ(${-rz}deg) rotateX(${-tilt}deg) scale(${1 / s}) translate(-50%,-100%)`;
  }
  const on = (a) => ease(prog(t, a, a + 0.4));
  L.agua.style.opacity = on(2.6) * (1 - on(4.3));
  L.lixo.style.opacity = on(3.0) * (1 - on(4.3));
  L.quadra.style.opacity = on(4.1);
  L.salao.style.opacity = on(4.4);
  L.play.style.opacity = on(4.7);
  L.tag.style.opacity = on(4.8);
  L.facial.style.opacity = on(5.6);
  cap1.setAttribute("opacity", Math.min(on(0.3), 1 - ease(prog(t, 1.9, 2.4))));
  // ---- carro entra pela TAG ----
  const cy1 = t < 4.9 ? lerp(1700, 1540, ease(prog(t, 2.6, 4.9))) : lerp(1540, 1300, ease(prog(t, 5.6, 6.8)));
  car.style.transform = `translate3d(${380}px,${cy1}px,0)`;
  const g = ease(prog(t, 5.0, 5.6));
  gate.style.transform = `translate3d(${330 - 88 * g}px,${1520}px,0)`;
  const blink = (a) => (t > a && t < a + 0.7 ? 0.35 + 0.65 * Math.abs(Math.sin((t - a) * 14)) : 1);
  tagLight.style.filter = `brightness(${t > 4.9 && t < 5.6 ? 1.8 : 0.7}) opacity(${blink(4.9)})`;
  faceLight.style.filter = `brightness(${t > 5.7 && t < 6.4 ? 1.8 : 0.7}) opacity(${blink(5.7)})`;
  // ---- transição ----
  const fl = t < 6.85 ? ease(prog(t, 6.6, 6.85)) : 1 - ease(prog(t, 6.85, 7.3));
  flash.setAttribute("opacity", fl * 0.9);
  const front = t >= 6.85;
  document.getElementById("cam").style.visibility = front ? "hidden" : "visible";
  document.getElementById("front").style.opacity = front ? 1 : 0;
  // ---- cena de frente ----
  const fz = lerp(1.06, 1, ease(prog(t, 6.85, 10)));
  FS.setAttribute("transform", `translate(540 1700) scale(${fz}) translate(-540 -1700)`);
  fTag.setAttribute("opacity", 0.55 + 0.45 * Math.abs(Math.sin(t * 3)));
  fFace.setAttribute("opacity", 0.6 + 0.4 * Math.abs(Math.sin(t * 2.2)));
  beacon.setAttribute("opacity", Math.sin(t * 5) > 0 ? 1 : 0.25);
  // Maiane caminha da esquerda e para
  const walkK = ease(prog(t, 7.2, 9.6));
  const walking = t > 7.2 && t < 9.7 ? Math.min(1, prog(t, 7.2, 7.5), 1 - prog(t, 9.3, 9.7)) : 0;
  const ph = (t - 7.2) * Math.PI * 3.6;
  const mx = lerp(-260, 330, walkK);
  const bob = -Math.abs(Math.sin(ph)) * 10 * walking + Math.sin(t * 2.2) * 2 * (1 - walking);
  M.setAttribute("transform", `translate(${mx} ${1790 + bob}) scale(0.92)`);
  MB.setAttribute("transform", `rotate(${Math.sin(ph) * 1.6 * walking} 0 -450)`);
  legL.setAttribute("transform", `translate(0 ${-Math.max(0, Math.sin(ph)) * 34 * walking})`);
  legR.setAttribute("transform", `translate(0 ${-Math.max(0, -Math.sin(ph)) * 34 * walking})`);
  armL.setAttribute("transform", `rotate(${-Math.sin(ph) * 8 * walking} -106 -738)`);
  // levanta o iPhone e mostra a tela
  const up = ease(prog(t, 9.9, 10.6));
  armR.setAttribute("transform", `rotate(${Math.sin(ph) * 6 * walking - 8 * up} 112 -738)`);
  const a = 128 * up;
  fore.setAttribute("transform", `rotate(${a} 136 -575)`);
  phone.setAttribute("transform", `rotate(${-a} 133 -470)`);
  screen.setAttribute("opacity", ease(prog(t, 10.4, 10.8)));
  phone.querySelector(".pglow").setAttribute("opacity", ease(prog(t, 10.4, 10.8)));
  const bl = [8.4, 11.6].some((b) => Math.abs(t - b) < 0.07) ? 0.1 : 1;
  eyes.setAttribute("transform", `translate(0 -879) scale(1 ${bl}) translate(0 879)`);
  head.setAttribute("transform", `rotate(${Math.sin(t * 1.7) * 1.5} 0 -800)`);
  cap2.setAttribute("opacity", ease(prog(t, 10.8, 11.3)));
  badge.setAttribute("opacity", ease(prog(t, 11.4, 11.9)));
};
window.render(0);
</script>
<script src="conv.js"></script>
</body>
